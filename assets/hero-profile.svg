<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="auto">
  <defs>
    <pattern id="hero-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="blueprint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
  </defs>

  <!-- Mat Background -->
  <rect width="480" height="300" fill="url(#blueprint-grad)"/>
  <rect width="480" height="300" fill="url(#hero-grid)" opacity="0.6"/>

  <!-- Blueprint Margin Borders -->
  <rect x="16" y="16" width="448" height="268" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="20" y="20" width="440" height="260" fill="none" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Corner Crop / Alignment Crosses -->
  <path d="M 12 16 L 24 16 M 16 12 L 16 24" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 456 16 L 468 16 M 464 12 L 464 24" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 12 284 L 24 284 M 16 276 L 16 288" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 456 284 L 468 284 M 464 276 L 464 288" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Technical Header Tag -->
  <rect x="36" y="32" width="190" height="22" rx="3" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
  <text x="44" y="47" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">DOSSIER_REF // ARDHIE-01</text>

  <!-- Title & Identity -->
  <text x="36" y="82" fill="#f8fafc" font-family="'Besley', Georgia, serif" font-size="22" font-weight="700">Muhammad Ardhie</text>
  <text x="36" y="104" fill="#94a3b8" font-family="'Courier Prime', monospace" font-size="12" font-weight="600">ROLE: FULL-STACK &amp; MOBILE SYSTEMS</text>

  <!-- Spec Attributes -->
  <g transform="translate(36, 126)">
    <!-- Row 1 -->
    <text x="0" y="12" fill="#64748b" font-family="'Courier Prime', monospace" font-size="11">LOCATION:</text>
    <text x="80" y="12" fill="#e2e8f0" font-family="'Courier Prime', monospace" font-size="11" font-weight="700">Bandung, ID (UTC+7)</text>

    <!-- Row 2 -->
    <text x="0" y="32" fill="#64748b" font-family="'Courier Prime', monospace" font-size="11">FOCUS:</text>
    <text x="80" y="32" fill="#38bdf8" font-family="'Courier Prime', monospace" font-size="11" font-weight="700">Laravel &bull; React &bull; Kotlin &bull; Figma</text>

    <!-- Row 3 -->
    <text x="0" y="52" fill="#64748b" font-family="'Courier Prime', monospace" font-size="11">STATUS:</text>
    <text x="80" y="52" fill="#10b981" font-family="'Courier Prime', monospace" font-size="11" font-weight="700">ACTIVE // OPEN TO ENGAGEMENTS</text>

    <!-- Row 4 -->
    <text x="0" y="72" fill="#64748b" font-family="'Courier Prime', monospace" font-size="11">INTEGRITY:</text>
    <text x="80" y="72" fill="#cbd5e1" font-family="'Courier Prime', monospace" font-size="11">Zero runtime slop &bull; Clean architecture</text>
  </g>

  <!-- Red Verification Stamp Badge in corner -->
  <g transform="translate(290, 205) rotate(-6)">
    <rect x="0" y="0" width="156" height="52" rx="4" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="160, 4, 160, 4"/>
    <rect x="4" y="4" width="148" height="44" rx="2" fill="#ef4444" fill-opacity="0.12"/>
    <text x="78" y="24" fill="#ef4444" font-family="'Courier Prime', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">VERIFIED CRAFT</text>
    <text x="78" y="39" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle" letter-spacing="0.8">SERIAL #2026-ENG-08</text>
  </g>

  <!-- Technical Caliper Scale -->
  <g transform="translate(36, 248)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#475569" stroke-width="1"/>
    <line x1="55" y1="-2" x2="55" y2="2" stroke="#475569" stroke-width="1"/>
    <line x1="110" y1="-3" x2="110" y2="3" stroke="#475569" stroke-width="1"/>
    <line x1="165" y1="-2" x2="165" y2="2" stroke="#475569" stroke-width="1"/>
    <line x1="220" y1="-4" x2="220" y2="4" stroke="#475569" stroke-width="1"/>
    <text x="0" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">0mm</text>
    <text x="100" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">SCALE 1:1</text>
    <text x="200" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">220mm</text>
  </g>
</svg>
