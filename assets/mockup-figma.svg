<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Canvas Base -->
  <rect width="800" height="500" rx="12" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>
  <!-- Figma Style Toolbar Header -->
  <rect width="800" height="42" rx="12" fill="#1e293b"/>
  <rect y="30" width="800" height="12" fill="#1e293b"/>
  <!-- Figma colored logo mark -->
  <g transform="translate(20, 11)">
    <rect x="0" y="0" width="10" height="10" rx="5" fill="#f24e1e"/>
    <rect x="10" y="0" width="10" height="10" rx="5" fill="#ff7262"/>
    <rect x="0" y="10" width="10" height="10" rx="5" fill="#a259ff"/>
    <circle cx="15" cy="15" r="5" fill="#1abcfe"/>
  </g>
  <text x="50" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Ardhicon Design System v2.4 • Tokens &amp; Components</text>
  <rect x="670" y="9" width="112" height="24" rx="4" fill="#0b0f17" stroke="#334155" stroke-width="1"/>
  <text x="682" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SCALE: 100%</text>

  <!-- Left Column: Token Primitives (Colors & Scale) -->
  <rect x="24" y="60" width="230" height="420" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="88" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">DESIGN TOKENS (PRIMITIVES)</text>

  <!-- Color Swatch 1 -->
  <rect x="40" y="106" width="32" height="32" rx="6" fill="#0b0f17" stroke="#334155" stroke-width="1"/>
  <text x="82" y="122" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">canvas.base</text>
  <text x="82" y="136" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">#0B0F17</text>

  <!-- Color Swatch 2 -->
  <rect x="40" y="150" width="32" height="32" rx="6" fill="#1e293b"/>
  <text x="82" y="166" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">surface.lift</text>
  <text x="82" y="180" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">#1E293B</text>

  <!-- Color Swatch 3 -->
  <rect x="40" y="194" width="32" height="32" rx="6" fill="#3b82f6"/>
  <text x="82" y="210" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">action.primary</text>
  <text x="82" y="224" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">#3B82F6</text>

  <!-- Color Swatch 4 -->
  <rect x="40" y="238" width="32" height="32" rx="6" fill="#10b981"/>
  <text x="82" y="254" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">status.active</text>
  <text x="82" y="268" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">#10B981</text>

  <line x1="40" y1="288" x2="234" y2="288" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="312" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">TYPOGRAPHY HIERARCHY</text>
  <text x="40" y="338" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Display 48px / -0.03em</text>
  <text x="40" y="364" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Heading 24px / -0.02em</text>
  <text x="40" y="390" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Body 16px / 1.65 Line Height</text>
  <text x="40" y="416" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Mono 14px / Tabular Numbers</text>

