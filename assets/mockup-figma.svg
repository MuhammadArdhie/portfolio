  <!-- Component Card 1: Buttons Matrix -->
  <rect x="290" y="106" width="466" height="100" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="306" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BUTTON PRIMITIVES (DEFAULT / HOVER / DISABLED)</text>
  <!-- Primary Button -->
  <rect x="306" y="146" width="130" height="38" rx="6" fill="#3b82f6"/>
  <text x="330" y="170" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Primary CTA</text>
  <!-- Secondary Button -->
  <rect x="450" y="146" width="130" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="470" y="170" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Secondary</text>
