  <rect x="594" y="146" width="130" height="38" rx="6" fill="transparent" stroke="#1e293b" stroke-width="1"/>
  <text x="626" y="170" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Ghost</text>

  <!-- Component Card 2: Interactive Card Specimen -->
  <rect x="290" y="222" width="466" height="150" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="306" y="246" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">INTERACTIVE CARD ARTIFACT SPEC</text>
  <rect x="306" y="260" width="434" height="96" rx="6" fill="#0b0f17" stroke="#334155" stroke-width="1"/>
  <circle cx="330" cy="285" r="8" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="330" cy="285" r="4" fill="#10b981"/>
  <text x="350" y="289" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Production Node: Synced</text>
  <text x="350" y="309" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Auto-layout horizontal hug contents with 16px fluid padding.</text>
  <rect x="350" y="322" width="60" height="18" rx="3" fill="#1e293b"/>
  <text x="358" y="335" fill="#3b82f6" font-family="'JetBrains Mono', monospace" font-size="9">TOKENS</text>
  <rect x="418" y="322" width="60" height="18" rx="3" fill="#1e293b"/>
  <text x="428" y="335" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">GRID 8PT</text>

  <!-- Auto layout specs tag -->
  <rect x="290" y="390" width="466" height="70" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1"/>
  <text x="306" y="416" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">DESIGN SYSTEM GOVERNANCE</text>
  <text x="306" y="440" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12">140+ Components • 100% WCAG AAA Compliant • Variable Mode Ready</text>
</svg>
